experiment_name: "Test"
settings:
  variance_per_sample: 1

r1_codeforces_dataset:
  path_to_test_data: 'data/codeforces/generated_tests'
  path_to_contest_data : 'data/codeforces/data'
  cache: True
  cache_folder: 'data/cache'

create_dataset:
  path_to_submissions: 'data/submissions'
  path_to_test_data: 'data/codeforces/generated_tests'
  path_to_contest_data : 'data/codeforces/data'
  output_path: 'data/dataset.csv'

preprocess_dataset:
  path_to_dataset: 'data/dataset.csv'
  train_ratio: 0.15
  val_ratio: 0.15
  test_ratio: 0.7
  seed: 54
  code_mod_ratio_threshold: 0.6
  output_figures_path: 'data/figures'
  output_preprocessed_path: 'data/dataset_preprocessed.csv'
  output_train_path: 'data/dataset_train.csv'
  output_val_path: 'data/dataset_val.csv'
  output_test_path: 'data/dataset_test.csv'

predict:
  dataset:
    path_to_submissions: 'data/dataset_test.csv'
  methods:
    NaiveFixBugLLMMethod:
        vendor: 'OpenAI'
        model_name: 'gpt-5.1'
        reasoning_effort: 'medium'
        cache: False
        max_tokens: 32000

    GenerateFromScratchLLMMethod:
        vendor: 'OpenAI'
        model_name: 'gpt-5.1'
        reasoning_effort: 'medium'
        cache: False
        max_tokens: 32000

    DSPyOptimizedLLMMethod:
      vendor: 'OpenAI'
      model_name: 'gpt-5.1'
      reasoning_effort: 'medium'
      cache: False
      max_tokens: 32000
      model_path: 'data/models/optimized_model_gepa_v3.json'

  output:
    path: 'data/output_final_gpt-5.1'


evaluate:
  dataset:
    path_to_predictions: 'data/output_final_gpt-5.1'

    
fit:
  train_dataset:
    path_to_submissions: 'data/dataset_train.csv'
  val_dataset:
    path_to_submissions: 'data/dataset_val.csv'
  method:
    DSPyOptimizedLLMMethod:
      vendor: 'OpenAI'
      model_name: 'gpt-5-nano'
      reflection_model_name: 'gpt-5-mini'
      max_tokens: 32000
      cache: False
      seed: 42
      model_output_path: 'data/models/optimized_model_gepa_v3.json'