experiment_name: "Test"
settings:
  top_k: 100
  variance_per_sample: 3

r1_codeforces_dataset:
  path_to_test_data: 'data/codeforces/generated_tests'
  path_to_contest_data : 'data/codeforces/data'
  cache: True
  cache_folder: 'data/cache'

create_dataset:
  path_to_submissions: 'data/submissions'
  path_to_test_data: 'data/codeforces/generated_tests'
  path_to_contest_data : 'data/codeforces/data'
  output_path: 'data/dataset.csv'

preprocess_dataset:
  path_to_dataset: 'data/dataset.csv'
  train_ratio: 0.15
  val_ratio: 0.15
  test_ratio: 0.70
  seed: 54
  code_mod_ratio_threshold: 0.6
  output_figures_path: 'data/figures'
  output_train_path: 'data/dataset_train.csv'
  output_val_path: 'data/dataset_val.csv'
  output_test_path: 'data/dataset_test.csv'

predict:
  dataset:
    path_to_dataset: 'data/dataset_test.csv'
  methods:
    NaiveFixBugLLMMethod:
        vendor: 'OpenAI'
        model_name: 'gpt-5-nano'
        cache: False

    DSPyOptimizedLLMMethod:
      vendor: 'OpenAI'
      model_name: 'gpt-5-nano'
      cache: False
      model_path: 'data/models/optimized_model_gepa.json'
  output:
    path: 'data/output_sample_gpt_5_2'
    
fit:
  train_dataset:
    path_to_dataset: 'data/dataset_train.csv'
  val_dataset:
    path_to_dataset: 'data/dataset_val.csv'
  method:
    DSPyOptimizedLLMMethod:
      vendor: 'OpenAI'
      model_name: 'gpt-5-nano'
      reflection_model_name: 'gpt-5-mini'
      max_tokens: 32000
      cache: False
      seed: 42
      model_output_path: 'data/models/optimized_model_gepa_v2.json'