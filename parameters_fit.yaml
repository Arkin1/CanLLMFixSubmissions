experiment_name: "Test"
settings:
  top_k: 50
  variance_per_sample: 3
dataset:
  path_to_dataset: "data/dataset.csv"
  path_to_test_data: 'data/codeforces/generated_tests'
  path_to_contest_data : 'data/codeforces/data'
  code_mod_ratio_threshold: 0.5
  cache: True

create_dataset:
  path_to_submissions: "data/submissions"
  path_to_test_data: 'data/codeforces/generated_tests'
  path_to_contest_data : 'data/codeforces/data'
  cache: True

methods:
  NaiveFixBugLLMMethod:
      vendor: 'OpenAI'
      model_name: 'gpt-5-nano'
      cache: False
      
  GenerateFromScratchLLMMethod:
      vendor: 'OpenAI'
      model_name: 'gpt-5-nano'
      cache: False

  DSPyOptimizedLLMMethod:
    vendor: 'OpenAI'
    model_name: 'gpt-5-nano'
    cache: False
    
fit:
  DSPyOptimizedLLMMethod:
    vendor: 'OpenAI'
    model_name: 'gpt-5-nano'
    cache: False
    model_output_path: 'data/models/optimized_model_gepa.json'

output:
  path: 'data/output_test_val_5_fit_v3'